name: Governance Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package-and-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag on the published branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/codex/agent-separation; then
            echo "Governance release tag must point to codex/agent-separation." >&2
            exit 1
          fi
      - name: Package governance archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="golden-starter-codex-governance-${version}"
          mkdir -p release-artifacts
          git archive --format=tar.gz --prefix="${name}/" HEAD -o "release-artifacts/${name}.tar.gz"
          git archive --format=zip --prefix="${name}/" HEAD -o "release-artifacts/${name}.zip"
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: GoldenStarterCodex governance ${{ github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
