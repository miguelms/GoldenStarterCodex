name: Governance CI

on:
  push:
    branches: [main, codex/agent-separation]
  pull_request:
    branches: [main, codex/agent-separation]
  workflow_call:

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validate Codex governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate profiles, skills and repository boundaries
        run: python3 scripts/validate-codex-governance.py
      - name: Check formatting
        run: npx --yes prettier@3.4.2 --check .
